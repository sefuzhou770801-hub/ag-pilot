<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CC-Codex Bridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="card">
      <header class="card-header">
        <div class="header-icon">⚡</div>
        <div class="header-copy">
          <h1>消息路由</h1>
          <p>CC ↔ Codex 控制面板</p>
        </div>
        <span class="header-pill" id="headerPill">检查中</span>
      </header>

      <section class="group-bar" aria-label="桥接分组">
        <div class="group-tabs" id="groupTabs"></div>
        <button class="group-add" id="addGroupBtn" type="button" aria-label="创建新分组">+</button>
      </section>

      <section class="node-section" id="ccSection">
        <div class="node-label">Antigravity</div>
        <button class="node-card node-card--cc" id="ccCard" type="button">
          <div class="node-main">
            <span class="node-dot node-dot--cc"></span>
            <span class="node-name" id="ccName">读取中...</span>
          </div>
          <span class="node-status" id="ccStatus">...</span>
          <svg class="node-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="dropdown" id="ccDropdown">
          <div class="dropdown-list" id="ccList"></div>
        </div>
      </section>

      <div class="bridge-arrow" id="bridgeArrow">
        <div class="signal-line signal-line--left"><span></span></div>
        <div class="bridge-hub">
          <span class="bridge-hub-icon">↔</span>
          <span class="bridge-hub-label">Live route</span>
        </div>
        <div class="signal-line signal-line--right"><span></span></div>
      </div>

      <section class="node-section" id="codexSection">
        <div class="node-label">Codex</div>
        <button class="node-card node-card--codex" id="codexCard" type="button">
          <div class="node-main">
            <span class="node-dot node-dot--codex"></span>
            <span class="node-name" id="codexName">读取中...</span>
          </div>
          <span class="node-status" id="codexStatus">...</span>
          <svg class="node-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="dropdown" id="codexDropdown">
          <div class="dropdown-list" id="codexList"></div>
        </div>
      </section>

      <div class="safety" id="safetyBanner">
        <span class="safety-dot" id="safetyDot"></span>
        <span class="safety-text" id="safetyText">检查中...</span>
      </div>

      <section class="telemetry-grid" aria-label="连接状态">
        <div class="telemetry-item">
          <span class="telemetry-label">CDP</span>
          <span class="telemetry-value" id="metricCdp">--</span>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-label">Targets</span>
          <span class="telemetry-value" id="metricTargets">--</span>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-label">IPC</span>
          <span class="telemetry-value" id="metricIpc">--</span>
        </div>
      </section>

      <footer class="card-footer">
        <span class="footer-text" id="footerText">连接中...</span>
        <span class="footer-time" id="footerTime">--:--</span>
      </footer>
    </main>

    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
